name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    # `head` is advisory: it builds Ruby from master, so it can break for
    # reasons that are nobody's fault here, and a red X on every unrelated PR
    # would train people to ignore the whole matrix. It earns its place anyway
    # - a stricter JSON parser in a newer Ruby broke the vector loader, and
    # nothing caught it until someone happened to install that Ruby locally.
    # This is the job that would have said so first.
    continue-on-error: ${{ matrix.ruby-version == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        # 2.6 is the declared floor (restless-sdk.gemspec) and must stay in
        # step with it. Ruby 4.0 is not in the runner toolcache yet, so `head`
        # is how the next major gets exercised until it is.
        ruby-version: ["2.6", "2.7", "3.0", "3.2", "3.4", "head"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      # Includes test/test_vectors.rb, which replays the vendored conformance
      # vectors in-process. A Ruby developer gets a contract failure without
      # needing Node installed. No bundler: the SDK has no dependencies.
      - run: ruby -Ilib -Itest test/all.rb

  conformance:
    name: conformance harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }
      - uses: actions/setup-node@v4
        with: { node-version: 20.x }

      # META-003: an SDK must run the shared harness against its driver. The
      # harness and the vectors live in the Node SDK, the reference
      # implementation, so this job checks that repo out rather than keeping a
      # second copy of them here. Both repos are public, so the default
      # GITHUB_TOKEN is enough and no secret is involved.
      #
      # The `test` job above replays the same vectors in-process from the
      # pinned copy in spec/, which is what gives a Ruby developer a contract
      # failure without needing Node installed. This job is the check that the
      # pinned copy has not drifted from the reference.
      - name: Check out the reference SDK
        uses: actions/checkout@v4
        with:
          repository: restlesshq/node
          path: .reference

      - name: Replay conformance vectors
        run: |
          node .reference/spec/harness/run-vectors.mjs \
            --json conformance.json -- ruby exe/restless-conformance

      - name: Differential fuzz against the reference
        run: |
          cd .reference && npm ci && npm run spec:driver && cd ..
          for seed in 24301 1 4242 99991; do
            node .reference/spec/harness/fuzz.mjs \
              --ref "node .reference/spec/driver/.build/node.js" \
              --test "ruby exe/restless-conformance" \
              --iterations 8000 --seed "$seed"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance.json
